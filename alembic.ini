[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is supplied at runtime from the DATABASE_URL environment variable
# (see migrations/env.py). It is deliberately left blank here so that no
# credential ever lands in source control and so that the migration runner
# always targets the same database the application itself connects to.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
