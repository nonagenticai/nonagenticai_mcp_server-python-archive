[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "runner"]

[project]
license = "Apache-2.0"
name = "nonagenticai_mcp_server"
version = "2.0.0"
description = "Versioned executable catalog foundation (execution unavailable)"
authors = [
    { name = "georgiedekker", email = "georgiedekker@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "alembic>=1.16.5",
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
    # tenant egress pins connections via httpx.AsyncHTTPTransport._pool + httpcore network_backend
    # (src/broker/egress.py): exact pins; bump only with tests/test_builder_egress.py green.
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "fastmcp==4.1.4",
    # builtin provider (src/builtin, src/auth/keycloak.py), ported from main #41-#46
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=47.0.0",
    "cachetools>=7.1.1",
    "pypdf>=6.21.4",  # BSD-3-Clause; consolidated-text PDFs for legal_eli_act_text
]

[project.optional-dependencies]
worker = ["kubernetes>=35.0.0,<38"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "ty>=0.0.34",
    "ruff>=0.15.12",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.3.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.0",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore:coroutine .* was never awaited:RuntimeWarning:unittest.mock",
    "ignore:coroutine .* was never awaited:RuntimeWarning:_pytest.stash",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]  # E402: imports after path/logging setup is intentional

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".worktrees/**"]

[tool.ty.rules]
unresolved-import = "ignore"
