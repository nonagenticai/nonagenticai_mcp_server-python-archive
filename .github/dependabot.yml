version: 2

updates:
  # uv, not pip: both trees are locked with uv. The `pip` ecosystem does not read uv.lock,
  # so it would resolve a different dependency set than the one that ships.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps-runner)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      all-non-major:
        update-types:
          - minor
          - patch
